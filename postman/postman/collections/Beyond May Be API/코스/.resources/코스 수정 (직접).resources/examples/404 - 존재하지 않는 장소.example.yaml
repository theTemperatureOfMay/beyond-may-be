$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/courses/1/places"
  method: PUT
  headers:
    Content-Type: application/json
    Authorization: Bearer {{accessToken}}
  body:
    type: json
    content: |-
      {
        "places": [
          { "placeId": 1, "dayNumber": 1, "visitOrder": 1 },
          { "placeId": 2, "dayNumber": 1, "visitOrder": 2 },
          { "placeId": 999999, "dayNumber": 1, "visitOrder": 3 }
        ]
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "선택한 장소를 찾을 수 없습니다.",
        "code": "COURSE404_2",
        "data": null,
        "success": false
      }
order: 4000
