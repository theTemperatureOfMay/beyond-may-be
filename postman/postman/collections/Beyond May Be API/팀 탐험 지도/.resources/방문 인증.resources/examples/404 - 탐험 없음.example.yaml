$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/visits"
  method: POST
  headers:
    Authorization: Bearer {{accessToken}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "explorationId": 999999,
        "placeId": 121,
        "latitude": 35.1402,
        "longitude": 126.9124,
        "accuracyMeters": 18.5
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "탐험을 찾을 수 없습니다.",
        "code": "EXPLORATION404",
        "data": null,
        "success": false
      }
order: 4000
