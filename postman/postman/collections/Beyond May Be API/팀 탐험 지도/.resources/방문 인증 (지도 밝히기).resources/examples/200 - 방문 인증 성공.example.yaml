$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/explorations/1/places/1/visits"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{accessToken}}
  body:
    type: json
    content: |-
      {
        "latitude": 35.1595,
        "longitude": 126.8526
      }
