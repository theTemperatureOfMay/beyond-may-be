$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/explorations/1/places/1/visits"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{accessToken}}
  body:
    type: json
    content: |-
      {
        "latitude": 35.2000,
        "longitude": 126.9000
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "인증 반경을 벗어났습니다.",
        "code": "VISIT400",
        "data": null,
        "success": false
      }
order: 2000
