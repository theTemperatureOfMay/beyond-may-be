$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/explorations/999999/participants/me/location-sharing"
  method: PATCH
  headers:
    Authorization: Bearer {{accessToken}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "enabled": true
      }
