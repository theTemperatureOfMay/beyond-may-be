$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/explorations/44/participants/me/location-sharing"
  method: PATCH
  headers:
    Authorization: Bearer {{accessToken}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "enabled": true
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "해당 탐험의 활성 참여자가 아닙니다.",
        "code": "EXPLORATION403",
        "data": null,
        "success": false
      }
order: 4000
