$kind: http-request
description: "로그인한 사용자가 성향 검사를 다시 치렀을 때 최종 성향 유형과 유형별 점수를 갱신합니다. 인증 필요: `Authorization: Bearer {{accessToken}}`. 회원가입 때와 같은 4개 점수 필드를 그대로 보내며, 4개 모두 비우면 400을 반환합니다."
url: "{{baseUrl}}/api/v1/users/me/preference"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "thinkerScore": 1,
      "foodieScore": 1,
      "artistScore": 9,
      "remembererScore": 1
    }
examples: ./.resources/나의 성향 재검사.resources/examples
order: 2000
