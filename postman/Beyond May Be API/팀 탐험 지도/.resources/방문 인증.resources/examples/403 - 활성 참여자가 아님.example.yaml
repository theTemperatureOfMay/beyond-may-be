$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/visits"
  method: POST
  headers:
    Authorization: Bearer {{accessToken}}
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "explorationId": 44,
        "placeId": 121,
        "latitude": 35.1402,
        "longitude": 126.9124,
        "accuracyMeters": 18.5
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "해당 탐험의 활성 참여자가 아닙니다.",
        "code": "EXPLORATION403",
        "data": null,
        "success": false
      }
order: 3000
