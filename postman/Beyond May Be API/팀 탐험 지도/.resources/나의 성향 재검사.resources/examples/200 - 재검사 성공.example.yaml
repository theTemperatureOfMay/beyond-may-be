$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/users/me/preference"
  method: PUT
  headers:
    Content-Type: application/json
    Authorization: Bearer {{accessToken}}
  body:
    type: json
    content: |-
      {
        "thinkerScore": 1,
        "foodieScore": 1,
        "artistScore": 9,
        "remembererScore": 1
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "성공입니다.",
        "code": "COMMON200",
        "data": {
          "userId": 1,
          "nickname": "여행자",
          "preferenceType": "ARTIST",
          "thinkerScore": 1,
          "foodieScore": 1,
          "artistScore": 9,
          "remembererScore": 1
        },
        "success": true
      }
order: 1000
