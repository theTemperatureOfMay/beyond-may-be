$kind: http-request
description: "같은 탐험의 ACTIVE 참여자가 역할과 관계없이 BEFORE 탐험을 한 번만 ONGOING으로 전환합니다(4.2.4). 인증 필요: `Authorization: Bearer {{accessToken}}`. Path variable `explorationId`; query와 요청 본문은 없습니다. GPS 권한은 프런트엔드 책임이며 상태 전환 커밋 후 `EXPLORATION_STARTED` 이벤트를 발행합니다."
url: "{{baseUrl}}/api/v1/explorations/44/start"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
examples: ./.resources/탐험 시작.resources/examples
