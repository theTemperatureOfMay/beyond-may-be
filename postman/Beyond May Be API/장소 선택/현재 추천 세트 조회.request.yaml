$kind: http-request
description: 인증된 현재 사용자의 저장된 추천 세트 하나를 조회합니다. Path·Query·Body는 없으며, 장소 ID 배열을 앞에서부터 20개씩 나눈 모든 회차와 서버에 확정된 좋아요·싫어요·완료 상태를 반환합니다. 같은 추천 세트에서 장소는 반복되지 않고 마지막 1~19곳 또는 빈 회차는 최종 회차입니다. places[].summary는 string 또는 null이며 비동기 상세 보강 전이나 실패 시 null일 수 있고, thumbnailUrl도 대표 이미지가 없으면 null입니다. 현재 카드 위치, 일괄 전송 전 반응과 되돌리기 이력은 프런트엔드 로컬 상태입니다. 인증 정보가 없거나 만료되면 401, 현재 추천 세트가 없으면 404, 조회 실패는 500을 반환합니다.
url: "{{baseUrl}}/api/v1/recommendations"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
examples: ./.resources/현재 추천 세트 조회.resources/examples
order: 3000
