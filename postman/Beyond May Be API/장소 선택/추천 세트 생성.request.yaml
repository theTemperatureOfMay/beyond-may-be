$kind: http-request
description: 인증 사용자의 저장된 성향 점수와 여행 기간으로 현재 추천 세트를 생성하거나 같은 일정의 저장 결과를 반환합니다. 최초 유형별 할당량보다 활성 DB 장소가 부족하면 TourAPI 광주 변경분을 최대 한 번 조회해 유효한 신규 장소를 먼저 저장하며, 외부 실패 시 기존 DB 후보로 계속합니다. 새 추천 응답에 포함된 장소의 빈 설명·운영시간은 응답과 분리된 내부 작업으로 최선 노력 보강하며 현재 응답은 변경하지 않습니다. 전체 처리 시간이 30초를 넘으면 503과 RECOMMENDATION503을 반환하고 자동 재시도하지 않습니다. Authorization Bearer 토큰이 필요하며 사용자 ID와 성향 점수는 요청에 넣지 않습니다.
url: "{{baseUrl}}/api/v1/recommendations/sets"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "travelSchedule": "ONE_NIGHT_TWO_DAYS",
      "startDate": "2099-08-20",
      "endDate": "2099-08-21"
    }
examples: ./.resources/추천 세트 생성.resources/examples
order: 4000
