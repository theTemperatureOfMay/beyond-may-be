$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/recommendations/sets"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{accessToken}}
  body:
    type: json
    content: |-
      {
        "travelSchedule": "ONE_NIGHT_TWO_DAYS",
        "startDate": "2099-08-20",
        "endDate": "2099-08-20"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "여행 기간이 올바르지 않습니다.",
        "code": "RECOMMENDATION400",
        "data": null,
        "success": false
      }
order: 2000
