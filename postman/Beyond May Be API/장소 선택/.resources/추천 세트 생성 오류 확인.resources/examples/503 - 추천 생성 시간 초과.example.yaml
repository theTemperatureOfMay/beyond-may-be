$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/recommendations/sets"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{accessToken}}
  body:
    type: json
    content: |-
      {
        "travelSchedule": "DAY_TRIP",
        "startDate": "2099-08-20",
        "endDate": "2099-08-20"
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "추천 생성 시간이 초과되었습니다.",
        "code": "RECOMMENDATION503",
        "data": null,
        "success": false
      }
order: 3000
