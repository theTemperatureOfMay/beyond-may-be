$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/recommendations/sets"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{accessToken}}
  body:
    type: json
    content: |-
      {
        "travelSchedule": "DAY_TRIP",
        "startDate": "2099-08-20",
        "endDate": "2099-08-20"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "완료된 여행 성향 검사가 필요합니다.",
        "code": "RECOMMENDATION409",
        "data": null,
        "success": false
      }
order: 1000
