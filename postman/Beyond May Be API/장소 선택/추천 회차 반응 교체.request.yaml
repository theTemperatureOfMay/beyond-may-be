$kind: http-request
description: 인증 사용자가 추천 회차의 좋아요·싫어요 전체를 교체합니다. 두 배열은 현재 보이는 회차 장소를 중복·교집합·누락 없이 정확히 분할해야 합니다. 전체 좋아요가 기간별 최소 수보다 적으면 기존 다음 회차 또는 미노출 장소 최대 20곳의 새 회차를 반환합니다. 새 후보가 부족하면 TourAPI 변경분을 한 번 보충하고, 그래도 1~19곳만 남으면 중복 없는 최종 부분 회차로 저장합니다. 남은 장소가 없거나 최초 회차가 빈 목록이면 nextBatch는 null입니다. 현재 추천·회차 없음은 404, AI 선별 중 추천 구성 변경은 409, 저장·생성 실패는 500이며 자동 재시도와 영속 멱등성 키는 사용하지 않습니다.
url: "{{baseUrl}}/api/v1/recommendations/1/reactions"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "likedPlaceIds": [101, 103, 107],
      "dislikedPlaceIds": [102, 104, 105]
    }
examples: ./.resources/추천 회차 반응 교체.resources/examples
order: 6000
