$kind: http-request
description: 추천 세트 생성의 인증·최종 성향·처리 시간 초과 오류 예시입니다. 최종 성향이 없는 인증 사용자는 409, 토큰이 없거나 만료되면 401, 전체 처리 시간이 30초를 넘으면 503을 반환합니다.
url: "{{baseUrl}}/api/v1/recommendations/sets"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "travelSchedule": "DAY_TRIP",
      "startDate": "2099-08-20",
      "endDate": "2099-08-20"
    }
examples: ./.resources/추천 세트 생성 오류 확인.resources/examples
order: 5000
