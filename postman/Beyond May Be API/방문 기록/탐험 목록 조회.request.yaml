description: "여행 기록의 진행 중·완료 코스 카드를 조회합니다(5.1.1, 5.1.2). 인증 필요: `Authorization: Bearer {{accessToken}}`. 필수 query `status`는 `ONGOING` 또는 `COMPLETED`만 허용하며 요청 본문은 없습니다. 현재·과거 참여 탐험을 반환하고, 완료 목록은 `completedAt` 내림차순입니다. 팀 진행률은 CoursePlace Visit만 집계하며 대표 이미지는 코스 순서상 첫 유효 썸네일입니다. 결과가 없으면 빈 배열과 `totalCount: 0`을 반환합니다."
url: "{{baseUrl}}/api/v1/explorations?status=COMPLETED"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
