description: "한 탐험의 전체 팀 방문을 장소별로 집계합니다(5.2.2). 인증 필요: Authorization: Bearer {{accessToken}}. 필수 query explorationId는 양의 int64이며 현재 또는 과거 참여자만 조회할 수 있습니다. 코스·주변 장소를 모두 포함해 lastVisitedAt 내림차순으로 반환하며, participantDisplayNames는 최초 방문 순서입니다. 검수 Place 좌표만 반환하고 사용자 GPS는 저장하거나 반환하지 않습니다. 빈 결과는 visitedPlaces 빈 배열과 totalVisitedPlaceCount 0입니다. 지도 렌더링·이미지 저장과 공유는 프런트엔드 책임입니다."
url: "{{baseUrl}}/api/v1/visits/visited-places?explorationId=44"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
