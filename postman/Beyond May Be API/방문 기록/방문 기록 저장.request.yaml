$kind: http-request
description: "방문 인증 후 사진·메모를 저장합니다(5.2.1). Visit 작성자인 ACTIVE 또는 COMPLETED 참여자만 허용하고 LEFT는 403입니다. 완료된 탐험에도 저장할 수 있습니다. multipart files는 선택적이며 같은 키로 여러 파일을 전송합니다. 기존 사진 포함 최대 3장·장당 10MB 이하 JPEG/PNG/WebP입니다. memo는 선택적 2,000자로 생략하면 기존 값을 유지하고 빈 문자열이면 지웁니다. 두 항목 모두 생략·길이/장수 초과 400, 타인/이탈 403, Visit 없음 404, 순서 충돌 409, 용량 초과 413, 형식 오류 415입니다. 성공은 200이며 visitId, memo, 이번 요청에서 추가한 photos를 반환합니다. 전체 사진은 팀 방문 GET으로 조회합니다. 실패 시 이번 요청의 사진·메모 DB 변경을 롤백하고 업로드 객체를 최선 노력으로 정리합니다."
url: "{{baseUrl}}/api/v1/visits/9001/record"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - type: text
      key: memo
      value: 골목 산책이 좋았어요.
    - type: file
      key: files
      src: []
examples: ./.resources/방문 기록 저장.resources/examples
order: 4000
