$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/visits/9001/record"
  method: POST
  headers:
    Authorization: Bearer {{accessToken}}
  body:
    type: formdata
    content:
      - type: text
        key: memo
        value: 골목 산책이 좋았어요.
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "금지된 요청입니다.",
        "code": "COMMON403",
        "data": null,
        "success": false
      }
order: 2000
