$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/visits/9001/photos"
  method: POST
  headers:
    Authorization: Bearer {{accessToken}}
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: []
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "생성에 성공했습니다.",
        "code": "COMMON201",
        "data": {
          "visitPhotoId": 501,
          "visitId": 9001,
          "displayOrder": 1,
          "imageUrl": "https://example-bucket.s3.ap-northeast-2.amazonaws.com/visits/9001/photo?X-Amz-Signature=example",
          "urlExpiresAt": "2026-08-15T15:32:10+09:00",
          "uploadedAt": "2026-08-15T14:33:00+09:00"
        },
        "success": true
      }
order: 1000
