$kind: http-request
description: "인증된 사용자가 만든 모든 코스를 수정 시각·코스 ID 내림차순으로 조회합니다. Authorization: Bearer {{accessToken}}이 필요하며 query와 본문은 없습니다. courseId, title, status(DRAFT/CONFIRMED), updatedAt, explorationId, explorationStatus를 반환합니다. 탐험이 없으면 탐험 필드는 null입니다. 다른 사람이 만든 코스는 합류했더라도 제외합니다. 현재 참여 중인 탐험은 별도 탐험 목록으로 조회합니다. 빈 목록은 200, 미인증은 401입니다."
url: "{{baseUrl}}/api/v1/courses"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
examples: ./.resources/내 코스 목록 조회.resources/examples
order: 500
