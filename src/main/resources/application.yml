spring:
  application:
    name: beyond-may-be
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    enabled: true
    locations: classpath:db/migration

tour-api:
  base-url: ${TOURISM_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  service-key: ${TOURISM_API_KEY:}

groq:
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  timeout-seconds: ${GROQ_TIMEOUT_SECONDS:60}

aws:
  region: ${AWS_REGION:ap-northeast-2}

visit-photo:
  bucket: ${VISIT_PHOTO_BUCKET:}
  url-expiration: ${VISIT_PHOTO_URL_EXPIRATION:PT1H}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
