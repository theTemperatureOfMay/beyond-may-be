services:
  postgres:
    image: postgres:17-alpine
    cpus: 1.0
    mem_limit: 1g
    environment:
      POSTGRES_DB: beyond_may_be_performance
      POSTGRES_USER: performance_user
      POSTGRES_PASSWORD: "${PERFORMANCE_DB_PASSWORD:-}"
    volumes:
      - performance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U performance_user -d beyond_may_be_performance",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: 0.5
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod,performance
      PERFORMANCE_TEST_ID: "${PERFORMANCE_TEST_ID:-}"
      DB_URL: jdbc:postgresql://postgres:5432/beyond_may_be_performance
      DB_USERNAME: performance_user
      DB_PASSWORD: "${PERFORMANCE_DB_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"

  k6:
    image: grafana/k6:2.2.0
    cpus: 1.0
    mem_limit: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./performance:/scripts:ro
      - ./performance-results:/results

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - performance_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  performance_postgres_data:
    name: beyond-may-be-performance-postgres-data
  performance_prometheus_data:
    name: beyond-may-be-performance-prometheus-data
    external: true
