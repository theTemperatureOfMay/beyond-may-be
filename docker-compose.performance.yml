services:
  postgres:
    image: postgres:17-alpine
    cpus: 1.0
    mem_limit: 1g
    environment:
      POSTGRES_DB: beyond_may_be_performance
      POSTGRES_USER: performance_user
      POSTGRES_PASSWORD: performance_password
    volumes:
      - performance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U performance_user -d beyond_may_be_performance",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    cpus: 0.5
    mem_limit: 1g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/beyond_may_be_performance
      DB_USERNAME: performance_user
      DB_PASSWORD: performance_password
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"

  k6:
    image: grafana/k6:2.2.0
    cpus: 1.0
    mem_limit: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./performance:/scripts:ro

volumes:
  performance_postgres_data:
    name: beyond-may-be-performance-postgres-data
